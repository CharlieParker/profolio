name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # paths-filter lists the PR's changed files via the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      charts: ${{ steps.filter.outputs.charts }}
      argocd: ${{ steps.filter.outputs.argocd }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            charts:
              - 'charts/**'
              - 'argocd/apps/**' # an Application's value files change what gets rendered
              - '.github/scripts/validate-charts.sh'
              - '.github/scripts/load-versions.sh'
              - '.github/ci/versions.env'
              - '.github/workflows/ci.yml'
            argocd:
              - 'argocd/**'
              - '.yamllint.yaml'
              - '.github/ci/versions.env'
              - '.github/ci/requirements.txt'
              - '.github/scripts/validate-argocd.sh'
              - '.github/scripts/load-versions.sh'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15" # keep in step with backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # matches frontend/Dockerfile's node:22 base
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash # explicit shell adds -o pipefail; the implicit default is only bash -e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions and checksums live in .github/ci/versions.env, shared with the
      # scripts so a local run uses the same pins. Must come before anything using them.
      - run: .github/scripts/load-versions.sh
      - name: Install Helm and kubeconform (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # yq is the runner image's pre-installed copy, deliberately unpinned - see the
      # header of validate-charts.sh. Its version is logged here for when that bites.
      - run: helm version && kubeconform -v && yq --version
      - run: .github/scripts/validate-charts.sh

  argocd:
    needs: changes
    if: needs.changes.outputs.argocd == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions and checksums live in .github/ci/versions.env, shared with the
      # scripts so a local run uses the same pins. Must come before anything using them.
      - run: .github/scripts/load-versions.sh
      - name: Install yamllint and PyYAML (hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --no-deps -r .github/ci/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install kubeconform (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: yamllint --version && kubeconform -v && python3 --version
      - run: .github/scripts/validate-argocd.sh

  ci-ok:
    needs: [changes, backend, frontend, charts, argocd]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled) exit 1 ;;
            esac
          done
