name: Deploy dev

# Builds and pushes the images whose code changed, tagged with the commit they were built
# from. It deploys nothing: dev moves when a PR bumps charts/*/values-dev.yaml, and that
# PR only touches charts/, so it never triggers a rebuild here.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual rebuild of both images, e.g. after a failed run

permissions:
  contents: read

# No concurrency group: every run pushes its own <sha> tag, so runs can't collide, and a
# group would cancel queued runs - losing builds when merges touch different images.
# Ordering matters for the bump that edits values-dev.yaml, not for builds.

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # JSON list of images to build, e.g. ["frontend"]. A manual run builds both.
      images: >-
        ${{ github.event_name == 'workflow_dispatch'
            && '["backend","frontend"]'
            || steps.filter.outputs.changes }}
    steps:
      # On a push (unlike a PR), paths-filter diffs with git, so it needs the repo here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      # With no `base`, a push to the default branch is compared with the commit before
      # the push: with squash merges, exactly what the merged PR changed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push'
        id: filter
        with:
          # Filter names must match the image names: they become the matrix below.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-dev.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-dev.yml'

  build:
    needs: changes
    # An empty matrix is an error, not a skip.
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    strategy:
      fail-fast: false # one image failing shouldn't cancel the other's build
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      # Hard-coded lowercase: image names must be, and github.repository_owner isn't.
      IMAGE: ghcr.io/charlieparker/profolio-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Buildx is Docker's newer build engine; the GitHub Actions layer cache needs it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64 # the cluster's architecture; no emulation needed
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Off for now so the pushed digest is the image itself, not an index wrapping it
          # and an attestation. Slice 2 adds signed build attestations properly.
          provenance: false
          # One cache per image, or the two builds overwrite each other's. mode=max also
          # caches the builder stage, where the slow dependency installs happen.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      # Values reach the script through env:, never ${{ }} inside run:, so no expression
      # can be spliced into the shell.
      - name: Write the image reference to the run summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### ${IMAGE##*/}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | [\`${SHA:0:7}\`](${COMMIT_URL}) |"
            echo "| Digest | \`${DIGEST}\` |"
            echo
            echo "Reference for the values-dev.yaml bump:"
            echo
            echo '```'
            echo "${IMAGE}:${SHA}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
