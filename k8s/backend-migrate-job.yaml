# Runs `alembic upgrade head` from the backend image. Idempotent: rerunning on an
# up-to-date database is a no-op. A Job's spec is immutable, so to rerun:
#   kubectl -n profolio-dev delete job backend-migrate && kubectl apply -f k8s/backend-migrate-job.yaml
# seed.py is deliberately not part of this — it's a manual, dev-only step.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: profolio-dev
  labels:
    app: backend-migrate
spec:
  backoffLimit: 6 # retries cover Postgres still starting up
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/charlieparker/profolio-backend:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
