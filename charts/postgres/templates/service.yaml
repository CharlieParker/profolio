# Headless Service (clusterIP: None): no virtual IP, DNS resolves straight to the pod, and
# gives the StatefulSet's pods stable names ({{ include "postgres.fullname" . }}-0...).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
