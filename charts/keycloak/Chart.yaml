  the app consumes it yet, OIDC integration is a separate, later pass.
type: application
version: 0.1.0
appVersion: "26.7.4"
dependencies:
  - name: keycloakx
    version: "7.3.2"
    repository: "https://codecentric.github.io/helm-charts"
