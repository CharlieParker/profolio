image:
  repository: ghcr.io/charlieparker/profolio-frontend
  tag: latest
  # Optional "sha256:…". When set, the image is pulled by digest; see _helpers.tpl
  digest: ""
  pullPolicy: Always

# Private GHCR package: pulled with this Secret, named explicitly here rather than
# attached to the namespace's default ServiceAccount.
imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

service:
  port: 80
  targetPort: 8080

# Optional Ingress: reach the frontend by hostname through the cluster's ingress controller.
# Off here; an environment's overlay turns it on. `host` is required when enabled.
# `className` picks the controller; empty leaves it to the cluster's default.
ingress:
  enabled: false
  className: ""
  host: ""

# Substituted into nginx's config at container start via envsubst templating; no trailing
# path, so /api/... is forwarded to the backend unchanged. Relies on the backend chart
# being installed under release name "backend" in the same namespace (see ../README.md).
config:
  backendUrl: http://backend:8000

probes:
  path: /
  readiness:
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
