apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  # substituted into nginx's config at container start; no trailing path, so /api/...
  # is forwarded to the backend unchanged
  BACKEND_URL: {{ .Values.config.backendUrl }}
