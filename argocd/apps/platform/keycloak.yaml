apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:CharlieParker/profolio.git
    targetRevision: main
    path: charts/keycloak
    helm:
      releaseName: keycloak
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
