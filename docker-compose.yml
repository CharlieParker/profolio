services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: profolio
      POSTGRES_PASSWORD: profolio
      POSTGRES_DB: profolio
    ports:
      - "5432:5432"
    volumes:
      - profolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://profolio:profolio@postgres:5432/profolio
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  profolio_pgdata:
